# 深大三类五点基准：宽640×高480，R 为五点中的索引2。
# 自训练权重采用同一协议，交付后只修改 model 路径。
input:
  type: video
  path: ../data/video/官方/符.avi
auto_buff:
  detect:
    tracy_debug: false  # yolo_profile 的耗时采集开关；普通检测不启动 Tracy。
    debug: false # 检测模块调试显示；不影响检测结果。
    backend: yolo
    model: ../../auto_buff/buff_detect/yolo/model/rune_szu.onnx # 深大基准；新自训练权重使用完全相同的三类五点协议。
    color: red
    confidence: 0.25
    point_confidence: 0.8  # 至少三个有效点；PnP 初始化仍要求完整四端点。
    nms_distance: 30       # 同组符板中心的去重距离，原图像素；不是 IoU。
    threads: 4
    feature_points: rmcs_pixels # none 使用原始四点求板心；rmcs_pixels 在局部 ROI 精修。
display: {} # 公共字体等显示服务参数。
