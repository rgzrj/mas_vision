<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc">
  <title id="title">神符YOLO单项实验对照</title>
  <desc id="desc">A基线、B只改训练数据、C只加一种增强、D比较同一权重的FP32和INT8。验证素材与部署接口固定；未改善就回退；测试集只作最终验收。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#526477"/></marker>
  </defs>
  <rect width="1080" height="440" rx="16" fill="#f5f8fc"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#182c40">
    <text x="40" y="44" font-size="25" font-weight="700">每次只动一个地方，才知道进步从哪里来</text>
    <rect x="40" y="66" width="1000" height="56" rx="10" fill="#e3edf9"/>
    <text x="60" y="101" font-size="18">固定：三类五点接口 · 640×480输入 · 同一验证素材 · 同一评估规则</text>
    <g font-size="18">
      <rect x="40" y="156" width="220" height="151" rx="12" fill="white" stroke="#9bb2cc" stroke-width="2"/>
      <text x="59" y="190" font-size="22" font-weight="700">A  建立基线</text>
      <text x="59" y="225">训练、导出先闭环</text>
      <text x="59" y="257">记录误差与漏检</text>
      <text x="59" y="285">知道原来哪里不行</text>
      <rect x="300" y="156" width="220" height="151" rx="12" fill="white" stroke="#7ba797" stroke-width="2"/>
      <text x="319" y="190" font-size="22" font-weight="700">B  只改数据</text>
      <text x="319" y="225">修错标 / 补一类难例</text>
      <text x="319" y="257">训练配置保持一致</text>
      <text x="319" y="285">看对应场景是否改善</text>
      <rect x="560" y="156" width="220" height="151" rx="12" fill="white" stroke="#7ba797" stroke-width="2"/>
      <text x="579" y="190" font-size="22" font-weight="700">C  只改增强</text>
      <text x="579" y="225">一次只加一种增强</text>
      <text x="579" y="257">先画回五点查标签</text>
      <text x="579" y="285">再看未见场次的表现</text>
      <rect x="820" y="156" width="220" height="151" rx="12" fill="white" stroke="#b59a73" stroke-width="2"/>
      <text x="839" y="190" font-size="22" font-weight="700">D  只改精度</text>
      <text x="839" y="225">同一权重 FP32 / INT8</text>
      <text x="839" y="257">分别测坐标与分数</text>
      <text x="839" y="285">在目标机测完整延迟</text>
    </g>
    <g stroke="#526477" stroke-width="2" marker-end="url(#arrow)"><path d="M264 231H293"/><path d="M524 231H553"/><path d="M784 231H813"/></g>
    <rect x="40" y="338" width="1000" height="65" rx="10" fill="#fff0d8"/>
    <text x="60" y="365" font-size="18" font-weight="700">没有改善就回退；小幅收益要排除随机波动。</text>
    <text x="60" y="390" font-size="17">图为实验建议，不是实测结果。val用于选方案，test留到方案和阈值冻结后验收。</text>
  </g>
</svg>
